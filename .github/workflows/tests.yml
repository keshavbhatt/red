# Native build + test suite on Ubuntu with the KDE Qt 6.11 snap SDK — the
# same recipe as scripts/dev-build.sh, so CI and the dev machine agree.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the Qt SDK and runtime snaps
        run: |
          sudo snap install kde-qt6-core24-sdk kf6-core24
          sudo apt-get update && sudo apt-get install -y ninja-build clang-format ffmpeg
      - name: Format check
        run: find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
      - name: Build and test
        run: RED_CMAKE_ARGS="-DRED_WERROR=ON" scripts/dev-build.sh --tests
