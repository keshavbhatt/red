# Builds the snap on GitHub's CI for amd64 and arm64 (never on a developer machine) and
# publishes it (DOCS/DECISIONS.md ADR-021):
#   push to master       -> edge      (version 10.3.1+git<hash>)
#   version tag v10.3.1  -> stable    (version 10.3.1; the tag must match project(VERSION))
# Edge is where a build is checked before it is tagged.
#
# Publishing needs the SNAPCRAFT_STORE_CREDENTIALS secret and the repo variable
# PUBLISH_TO_STORE=true; without them the snap is only built.
name: snap

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'dist/**'
      - 'snap/**'
      - '.github/workflows/snap.yml'
  workflow_dispatch:

concurrency:
  group: snap-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          project=$(awk '/^project\(red/ {on = 1} on && $1 == "VERSION" {print $2; exit}' CMakeLists.txt)
          if [ "${TAG#v}" != "$project" ]; then
            echo "tag $TAG does not match project(VERSION) $project in CMakeLists.txt" >&2
            exit 1
          fi

      - name: Build snap (${{ matrix.arch }})
        uses: snapcore/action-build@v1
        id: build

      - name: Publish to the Snap Store
        if: >-
          vars.PUBLISH_TO_STORE == 'true' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}
