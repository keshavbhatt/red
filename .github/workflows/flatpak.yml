# Builds the Flatpak on GitHub's CI from the in-tree manifest, as a check on
# manual runs and attached to the GitHub Release on a version tag. Nothing is
# stored as a workflow artifact. Flathub itself builds from its own repository
# (flathub/com.ktechpit.red) once the app is submitted there.
name: flatpak

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      # The newest published builder image; the 6.11 SDK is installed from
      # Flathub by flatpak-builder itself (--install-deps-from).
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Build Flatpak (${{ matrix.arch }})
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.ktechpit.red.yaml
          bundle: red-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          upload-artifact: false
          cache: false

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "red-${{ matrix.arch }}.flatpak" --clobber
