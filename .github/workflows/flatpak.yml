# Build the Flatpak from the in-tree manifest; on a version tag the bundle is
# attached to the GitHub Release. Flathub builds from its own repository.
name: flatpak

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Build Flatpak (${{ matrix.arch }})
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.ktechpit.red.yaml
          bundle: red-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          upload-artifact: false
          cache: false

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "red-${{ matrix.arch }}.flatpak" --clobber
