name: red-app
adopt-info: red
grade: stable
confinement: strict
base: core24
compression: lzo

title: Red
summary: YouTube, in a real desktop app
website: https://github.com/keshavbhatt/red
issues: https://github.com/keshavbhatt/red/issues
license: Proprietary
icon: snap/gui/icon.svg

platforms:
  amd64:
  arm64:

apps:
  red-app:
    command: usr/bin/red
    desktop: usr/share/applications/com.ktechpit.red.desktop
    common-id: com.ktechpit.red
    extensions:
      - kde-neon-6
    environment:
      # ffmpeg for the download engine comes from the ffmpeg-2404 content snap
      # (ADR-004): nothing is staged, nothing is downloaded.
      PATH: $SNAP/ffmpeg-platform/usr/bin:$PATH
      # CRAFT_ARCH_TRIPLET_BUILD_FOR is expanded at pack time (as in the
      # ultimate-media-downloader snap).
      LD_LIBRARY_PATH: $SNAP/ffmpeg-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH
    plugs:
      - ffmpeg-2404
      - home
      - desktop
      - desktop-legacy
      - opengl
      - x11
      - wayland
      - network
      - network-bind
      - network-status
      - unity7
      - browser-support
      - audio-playback
      - audio-record
      - removable-media
      - screen-inhibit-control
      # joystick: gamepads in TV mode (Chromium's Gamepad API reads /dev/input).
      - joystick

plugs:
  ffmpeg-2404:
    interface: content
    target: $SNAP/ffmpeg-platform
    default-provider: ffmpeg-2404

parts:
  # JavaScript runtime for the download engine (yt-dlp needs one since 2025,
  # ADR-004). Deno is yt-dlp's recommended runtime; with it in $SNAP/usr/bin
  # the app never downloads QuickJS. Same release and checksums as the
  # Flatpak manifest (packaging/flatpak/deno.yaml).
  deno:
    plugin: nil
    build-packages:
      - curl
      - unzip
    override-pull: |
      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64) asset=deno-x86_64-unknown-linux-gnu.zip
               sum=0cd918870657ccc3d96ac682290e894dda374e2a742424aae9118b258a6cf7a3 ;;
        arm64) asset=deno-aarch64-unknown-linux-gnu.zip
               sum=e654ef4b41d8f1369dfe7d69374c8f226660153d077e0ac25353d454e03ef798 ;;
        *) echo "no deno build for ${CRAFT_ARCH_BUILD_FOR}" >&2; exit 1 ;;
      esac
      curl -fsSL -o deno.zip "https://github.com/denoland/deno/releases/download/v2.7.7/${asset}"
      echo "${sum}  deno.zip" | sha256sum -c -
      unzip -o deno.zip deno
    override-build: |
      install -Dm755 "${CRAFT_PART_SRC}/deno" "${CRAFT_PART_INSTALL}/usr/bin/deno"
    prime:
      - usr/bin/deno

  red:
    plugin: cmake
    source: .
    parse-info:
      - usr/share/metainfo/com.ktechpit.red.metainfo.xml
    build-snaps:
      - cmake/latest/stable
    build-packages:
      - libxkbcommon-dev
      - libdrm-dev
    stage-packages:
      - libdrm2
      # libqxcb links against it; without it the snap does not start.
      - libxcb-shape0
      # OpenType coverage for confined Qt (the snap ships no host fonts).
      - fonts-noto-core
      # No ffmpeg package: the ffmpeg-2404 content snap provides the binary.
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DRED_BUILD_TESTS=OFF
    override-build: |
      craftctl default
      # One source of truth for the version: the CMake project, not the
      # metainfo release list (parse-info still supplies summary/description).
      VER=$(grep -m1 '^CMAKE_PROJECT_VERSION:STATIC=' "${CRAFT_PART_BUILD}/CMakeCache.txt" | cut -d= -f2)
      craftctl set version="${VER}"
      # Store icon; the desktop file keeps its stock Icon name, which the
      # kde-neon-6 extension resolves from the snap's hicolor tree.
      mkdir -p "${CRAFT_PART_INSTALL}/meta/gui"
      cp "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/512x512/apps/com.ktechpit.red.png" \
         "${CRAFT_PART_INSTALL}/meta/gui/icon.png"
    prime:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/share/ECM
      - -usr/share/man
      - -usr/share/doc
      - -usr/share/lintian
