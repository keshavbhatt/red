name: red-app
adopt-info: red
grade: stable
confinement: strict
base: core24
compression: lzo

title: Red - YouTube client for Linux
summary: YouTube and YouTube Music without ads, TV mode, SponsorBlock, downloads
description: |
  Red is a YouTube client for the Linux desktop: the real YouTube site in a native, lightweight
  window, with the things a browser tab cannot give you. Sign in with your Google account and your
  subscriptions, history and recommendations work as on the website.

  **Three ways to watch**

  * _Desktop mode_: the full YouTube website in light, dark or system theme, with a floating
    mini player that stays above other windows while you work.
  * _TV mode_: YouTube's smart TV interface (Leanback) full screen, driven by keyboard, mouse or
    a game controller. Perfect for a media center, a living room PC or a handheld. Switch with
    `Ctrl+T` at any time; the video you were watching carries over.
  * _Music mode_: YouTube Music in the same window (`Ctrl+M`), playing on while you browse, with
    media keys, tray and desktop media controls showing album and cover, and audio downloads one
    click away.

  **Watch without interruptions**

  * Built-in ad blocker: video ads, banners and sponsored feed items are removed before the page
    renders. Playback traffic is never touched, so it cannot break a video.
  * Tracker blocking, SponsorBlock to skip sponsor segments, intros and reminders, Return
    YouTube Dislike counts, and a switch to hide Shorts.

  **YouTube downloader built in**

  * Download any video, playlist or channel as MP4, MKV or WebM, up to 4K.
  * YouTube to MP3: save the audio only as MP3, M4A, Opus, FLAC or WAV.
  * Subtitles, thumbnail, metadata and chapters embedded; sponsor segments cut out on request.
  * Playlists are detected from any link, entries can be picked one by one, and the queue
    pauses, resumes and retries. Your sign-in is reused, so age-restricted videos download too.
  * The download engine sets itself up on first use and keeps itself updated.

  **Made for the desktop**

  * Media keys and desktop media controls (MPRIS), a tray icon with play, pause and skip, and an
    optional playback progress bar behind the taskbar entry.
  * The screen stays awake while a video plays; playback continues when the window is hidden.
  * Hardware video decoding, native Wayland and X11, notifications when a download finishes.
  * Single instance: `red-app <youtube-link>` opens the link, `red-app --download <link>` queues
    a download, `red-app --tv` starts in TV mode, `red-app --music` in Music mode.

  Guide and help: https://github.com/keshavbhatt/red/blob/master/GUIDE.md
  Bugs and requests: https://github.com/keshavbhatt/red/issues

  A lightweight alternative to the browser tab, to Electron YouTube apps and to a separate
  downloader. YouTube is a trademark of Google LLC; Red is an independent client and is not
  affiliated with YouTube or Google.
website: https://github.com/keshavbhatt/red
issues: https://github.com/keshavbhatt/red/issues
license: GPL-3.0-or-later # the licensing module has its own licence: LICENSING.md
icon: snap/gui/icon.svg

platforms:
  amd64:
  arm64:

apps:
  red-app:
    command: usr/bin/red
    desktop: usr/share/applications/com.ktechpit.red.desktop
    common-id: com.ktechpit.red
    extensions:
      - kde-neon-6
    environment:
      PATH: $SNAP/ffmpeg-platform/usr/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/ffmpeg-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH
    plugs:
      - ffmpeg-2404
      - home
      - desktop
      - desktop-legacy
      - opengl
      - x11
      - wayland
      - network
      - network-bind
      - network-status
      - unity7
      - browser-support
      - audio-playback
      - audio-record
      - removable-media
      - screen-inhibit-control
      - joystick # gamepads in TV mode

plugs:
  ffmpeg-2404:
    interface: content
    target: $SNAP/ffmpeg-platform
    default-provider: ffmpeg-2404

parts:
  # JavaScript runtime for the download engine
  deno:
    plugin: nil
    build-packages:
      - curl
      - unzip
    override-pull: |
      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64) asset=deno-x86_64-unknown-linux-gnu.zip
               sum=0cd918870657ccc3d96ac682290e894dda374e2a742424aae9118b258a6cf7a3 ;;
        arm64) asset=deno-aarch64-unknown-linux-gnu.zip
               sum=e654ef4b41d8f1369dfe7d69374c8f226660153d077e0ac25353d454e03ef798 ;;
        *) echo "no deno build for ${CRAFT_ARCH_BUILD_FOR}" >&2; exit 1 ;;
      esac
      curl -fsSL -o deno.zip "https://github.com/denoland/deno/releases/download/v2.7.7/${asset}"
      echo "${sum}  deno.zip" | sha256sum -c -
      unzip -o deno.zip deno
    override-build: |
      install -Dm755 "${CRAFT_PART_SRC}/deno" "${CRAFT_PART_INSTALL}/usr/bin/deno"
    prime:
      - usr/bin/deno

  red:
    plugin: cmake
    source: .
    parse-info:
      - usr/share/metainfo/com.ktechpit.red.metainfo.xml
    build-snaps:
      - cmake/latest/stable
    build-packages:
      - libxkbcommon-dev
      - libdrm-dev
    stage-packages:
      - libdrm2
      - libxcb-shape0 # libqxcb needs it
      - fonts-noto-core
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DRED_BUILD_TESTS=OFF
    override-build: |
      craftctl default
      # The version comes from the CMake project, the one source of truth. A build that is
      # not exactly a version tag (the edge channel) carries the commit: 10.3.1+git1a2b3c4.
      VER=$(grep -m1 '^CMAKE_PROJECT_VERSION:STATIC=' "${CRAFT_PART_BUILD}/CMakeCache.txt" | cut -d= -f2 | tr -d '[:space:]')
      if ! git -c safe.directory="*" -C "${CRAFT_PART_SRC}" describe --exact-match --tags --match "v${VER}" >/dev/null 2>&1; then
        HASH=$(git -c safe.directory="*" -C "${CRAFT_PART_SRC}" rev-parse --short=7 HEAD 2>/dev/null || true)
        [ -n "${HASH}" ] && VER="${VER}+git${HASH}"
      fi
      craftctl set version="${VER}"
      # store icon
      mkdir -p "${CRAFT_PART_INSTALL}/meta/gui"
      cp "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/512x512/apps/com.ktechpit.red.png" \
         "${CRAFT_PART_INSTALL}/meta/gui/icon.png"
    prime:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/share/ECM
      - -usr/share/man
      - -usr/share/doc
      - -usr/share/lintian
