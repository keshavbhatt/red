app-id: com.ktechpit.red
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: red
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # gamepads in TV mode
  - --device=input

  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.red

  # default download folder; others are picked through the portal
  - --filesystem=xdg-videos

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/doc

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - deno.yaml

  - name: red
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DRED_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../..
